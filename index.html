<style>
:root{--h:175;--bg:hsl(var(--h) 28% 97%);--card:hsl(var(--h) 25% 92%);--sf:hsl(var(--h) 30% 98%);--tx:hsl(var(--h) 20% 12%);--mut:hsl(var(--h) 12% 36%);--bd:hsl(var(--h) 15% 78%);--ac:hsl(var(--h) 60% 32%);--acx:#fff;--pc:hsl(var(--h) 65% 85%);--opc:hsl(var(--h) 70% 13%);--wb:hsl(40 90% 87%);--wn:hsl(30 80% 22%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 'Google Sans','Roboto',system-ui,sans-serif;transition:background .3s}
main{max-width:520px;margin:auto;padding:12px 16px 110px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 16px}
h1{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:0;line-height:1.05}
.icb{width:48px;height:48px;border-radius:16px;border:0;background:var(--pc);color:var(--opc);font-size:22px;transition:border-radius .25s}
.icb:active{border-radius:24px}
.c{background:var(--card);border-radius:28px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 4px 6px}
.r{display:flex;gap:8px}.r>*{flex:1}
input,select{width:100%;font:600 19px sans-serif;font-family:inherit;padding:14px 16px;border-radius:18px;border:2px solid transparent;background:var(--sf);color:var(--tx);outline:0;appearance:none}
input:focus,select:focus{border-color:var(--ac)}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch button{font:600 15px sans-serif;font-family:inherit;padding:10px 16px;border-radius:14px;border:0;background:var(--sf);color:var(--tx);transition:all .2s}
.ch button.on{background:var(--ac);color:var(--acx);border-radius:22px}
.ch button.on::before{content:'\2713  '}
#out{background:var(--pc);color:var(--opc);border-radius:36px 36px 36px 12px;padding:22px}
#out .mut{color:var(--opc);opacity:.78}
.big{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;margin:4px 0 6px}
.mut{color:var(--mut);font-size:14px}
.w{background:var(--wb);color:var(--wn);padding:12px 14px;border-radius:18px;font-size:14px;margin-top:10px}
#st{display:none}#st.o{display:block}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid transparent;transition:all .2s}
.sw button.on{border-color:var(--tx);border-radius:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px sans-serif;font-family:inherit}
nav button i{display:block;margin:0 auto 4px;width:64px;height:32px;line-height:32px;border-radius:16px;font-style:normal;font-size:18px;transition:all .25s}
nav button.on{color:var(--tx)}nav button.on i{background:var(--pc)}
.pb{height:56px;border:0;border-radius:20px;background:var(--ac);color:var(--acx);font:700 16px sans-serif;font-family:inherit}
#label{display:none}
